substitutions:
  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/H-1"
  beta_manifest_base: "https://github.com/ApolloAutomation/H-1/releases/download/beta-fw"
  ota_stable_manifest: "${stable_manifest_base}/firmware/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-standard.json"

  # Bluetooth Proxy switch state on a device with no stored preference yet
  # (first boot after this switch was added, or after a factory reset).
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_OFF

esphome:
  name: "apollo-h-1"
  friendly_name: Apollo H-1
  comment: Apollo H-1
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-1"
    version: "${version}"

  # improv_ble (renamed from esp32_improv) needs 2026.10;
  # the Firmware Update button uses get_source_url(), added in 2026.10.1
  min_version: 2026.10.1
  on_boot:
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |- 
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                  id(deep_sleep_1).prevent_deep_sleep(); 
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
  on_shutdown:
    - light.turn_off: rgb_light

dashboard_import:
  package_import_url: github://ApolloAutomation/H-1/Integrations/ESPHome/H-1_Minimal.yaml
  import_full_config: false

improv_serial:

improv_ble:
  authorizer: none

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: https://apolloautomation.github.io/H-1/firmware/manifest.json

wifi:
  on_connect:
    - delay: 5s
    - component.update: firmware_update
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo H1 Hotspot"

logger:

captive_portal:

web_server:
  version: 3
  port: 80

api:
  encryption:
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - service: play_song_1
      then:
        - script.execute: play_song_1
    - service: play_song_2
      then:
        - script.execute: play_song_2
    - service: play_song_3
      then:
        - script.execute: play_song_3
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |- 
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
switch:
  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |- 
                  id(deep_sleep_1).allow_deep_sleep();
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: ${bluetooth_proxy_restore_mode}
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

button:
  - platform: template
    name: "Firmware Update"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: "config"
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      # OTA download needs the device awake for its whole duration.
      - lambda: |-
          id(deep_sleep_1).prevent_deep_sleep();
      - delay: 3s
      - script.execute: install_selected_channel
      - script.wait: install_selected_channel
      # Only reached if the update did not start (e.g. manifest unreachable).
      # Re-arm deep sleep unless something else is holding the device awake.
      - if:
          condition:
            and:
              - switch.is_off: prevent_sleep
              - binary_sensor.is_off: ota_mode
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();

text_sensor:
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:  
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

script:
  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          const char *url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url);
          id(firmware_update).set_source_url(url);
      - component.update: firmware_update

  # The update component drops a check requested while another one is running,
  # so keep asking until install_selected_channel has what it needs.
  - id: request_channel_manifest
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - script.execute: apply_ota_source
            - script.wait: apply_ota_source
            - delay: 5s

  # Forced install, but only of a manifest fetched after this press from the
  # selected channel. mode single: a second press while this runs is ignored.
  - id: install_selected_channel
    mode: single
    then:
      # Mark the cached firmware URL as old. Only a successful check replaces it.
      - lambda: |-
          std::string &fw = const_cast<std::string &>(id(firmware_update).update_info.firmware_url);
          if (fw.rfind('!', 0) != 0) fw.insert(0, "!");
      - script.execute: request_channel_manifest
      # Wait for a check without error whose firmware sits in the directory of
      # the selected channel's manifest (relative Pages paths are merged with
      # it, beta paths are release-asset URLs in the same directory).
      - wait_until:
          timeout: 20s
          condition:
            lambda: |-
              const char *src = id(firmware_update).get_source_url();
              const size_t dir = strrchr(src, '/') - src + 1;
              return !id(firmware_update).status_has_error() &&
                     strncmp(id(firmware_update).update_info.firmware_url.c_str(), src, dir) == 0;
      - script.stop: request_channel_manifest
      - lambda: |-
          std::string &fw = const_cast<std::string &>(id(firmware_update).update_info.firmware_url);
          const char *src = id(firmware_update).get_source_url();
          const size_t dir = strrchr(src, '/') - src + 1;
          const bool err = id(firmware_update).status_has_error();
          const char *why = nullptr;
          if (fw.rfind('!', 0) == 0) {
            why = err ? "the manifest check failed" : "no manifest arrived within 20s";
            fw.erase(0, 1);  // put the old URL back for the update entity
          } else if (err) {
            why = "the latest manifest check failed";
          } else if (strncmp(fw.c_str(), src, dir) != 0) {
            why = "the manifest that arrived is not from the selected channel";
          }
          if (why != nullptr) {
            ESP_LOGW("firmware", "Firmware Update: %s (%s); not installing", why, src);
            return;
          }
          ESP_LOGI("firmware", "Installing %s", fw.c_str());
          id(firmware_update).perform(true);

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 40%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 40%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 40%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light


packages:
  core: !include Core.yaml
